[project]
name = "ortho4xp-scripts"
version = "0.1.0"
description = "Batch processing scripts for Ortho4XP"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.25.0",
    "shapely>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
