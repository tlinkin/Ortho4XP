[project]
name = "ortho4xp-scripts"
version = "0.1.0"
description = "Batch processing scripts for Ortho4XP"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.20.0",
    "numpy>=2.4.0",
    "Pillow>=12.0.0",
    "pyproj>=3.7.2",
    "requests>=2.32.5",
    "Rtree>=1.4.1",
    "shapely>=2.1.2",
    "scikit-fmm>=2025.6.23",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["batch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
