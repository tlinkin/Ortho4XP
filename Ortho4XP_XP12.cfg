# Ortho4XP Configuration for X-Plane 12 - Maximum Quality
#
# Optimized for: XP12 native water, maximum terrain detail, ZL17/19 imagery
#
# Usage:
#   Single tile:  python Ortho4XP.py --config Ortho4XP_XP12.cfg 47 8
#   Batch:        python Ortho4XP.py --config Ortho4XP_XP12.cfg --batch tiles.txt
#   Specific step: python Ortho4XP.py --config Ortho4XP_XP12.cfg 47 8 --mesh
#
# Steps: --osm, --mesh, --mask, --dsf, --overlay (or --steps osm,mesh,mask,dsf)

# =============================================================================
# X-PLANE 12 WATER
# =============================================================================
# XP12 uses native 3D water rendering - no mask imprinting needed
water_tech=XP12
imprint_masks_to_dds=False

# =============================================================================
# MESH QUALITY
# =============================================================================
# Lower curvature_tol = more triangles = better terrain detail
# limit_tris caps total triangles (millions) to keep X-Plane happy
curvature_tol=1.0
apt_curv_tol=0.3
apt_curv_ext=0.5
coast_curv_tol=0.5
coast_curv_ext=0.5
limit_tris=4.0
mesh_zl=19
min_angle=10.0
sea_smoothing_mode=zero
water_smoothing=10

# =============================================================================
# IMAGERY
# =============================================================================
# default_zl: base zoom level (17 = 0.6m/pixel)
# cover_zl: zoom level for airport coverage areas
# default_website: imagery provider code (BI, GO2, etc.)
default_zl=17
default_website=BI
cover_airports_with_highres=ICAO
cover_zl=19
cover_extent=1.0
sea_texture_blur=0.0

# =============================================================================
# WATER & MASKING
# =============================================================================
# 3steps mode: [shore_transition, constant_zone, fade_out] in meters
# mask_zl=16 for high detail coastlines
masking_mode=3steps
masks_width=100
mask_zl=16
ratio_water=0.25
ratio_bathy=1.0
distance_masks_too=True
masks_use_DEM_too=False
use_masks_for_inland=False

# =============================================================================
# DSF & RENDERING
# =============================================================================
terrain_casts_shadows=True
normal_map_strength=1.0
use_decal_on_terrain=True
overlay_lod=25000

# =============================================================================
# ROADS & VECTOR DATA
# =============================================================================
# road_level: 0=none, 1=major, 2=+tertiary, 3=+residential, 4=+service, 5=+tracks
road_level=1
road_banking_limit=0.5
lane_width=4.0
apt_smoothing_pix=8
clean_bad_geometries=True
water_simplification=0.0
min_area=0.001
max_area=200.0
max_levelled_segs=200000

# =============================================================================
# NETWORK & DOWNLOADS
# =============================================================================
# Aggressive parallel downloads - reduce if you get errors
max_download_slots=96
max_convert_slots=16
http_timeout=60.0
max_connect_retries=30
max_baddata_retries=30
check_tms_response=True
overpass_server_choice=KU

# =============================================================================
# PERFORMANCE & OUTPUT
# =============================================================================
verbosity=0
skip_downloads=False
skip_converts=False
cleaning_level=0

# =============================================================================
# CUSTOM DEM / LIDAR
# =============================================================================
# Place .hgt files in: Elevation_data/<10-degree-block>/
# Example: Elevation_data/N40E000/N47E008.hgt
#
# For iterate refinement, use semicolon-separated paths:
#   custom_dem=/path/base.hgt;/path/lidar.hgt
#              iterate=0       iterate=1
#
# IMPORTANT: cleaning_level=0 is REQUIRED for iterate to preserve mesh files
fill_nodata=False
iterate=0
#custom_dem=

# Iterate workflow:
#   1. Set iterate=0, run: python Ortho4XP.py 47 8 --mesh
#   2. Set iterate=1, run: python Ortho4XP.py 47 8 --mesh (refines previous)
#   3. Run masks and DSF: python Ortho4XP.py 47 8 --mask --dsf

# =============================================================================
# X-PLANE 12 OVERLAYS
# =============================================================================
# Point to your X-Plane 12 installation for overlay extraction
#
# Windows (Steam):
#   C:/Program Files (x86)/Steam/steamapps/common/X-Plane 12/...
# Windows (standalone):
#   C:/X-Plane 12/...
# macOS:
#   /Users/YOU/X-Plane 12/...
# Linux:
#   /home/YOU/.steam/steam/steamapps/common/X-Plane 12/...

custom_overlay_src=C:/Program Files (x86)/Steam/steamapps/common/X-Plane 12/Global Scenery/X-Plane 12 Global Scenery
custom_scenery_dir=C:/Program Files (x86)/Steam/steamapps/common/X-Plane 12/Custom Scenery
custom_overlay_src_alternate=
ovl_exclude_pol=[0]
ovl_exclude_net=[]
