# Ortho4XP Configuration for X-Plane 12 - Maximum Quality
#
# Optimized for: XP12 native water, maximum terrain detail, ZL17/19 imagery
#
# Usage:
#   python Ortho4XP.py --config Ortho4XP_XP12.cfg 47 8
#   python Ortho4XP.py --config Ortho4XP_XP12.cfg --batch tiles.txt

# =============================================================================
# X-PLANE 12 SPECIFIC
# =============================================================================
water_tech=XP12
imprint_masks_to_dds=False

# =============================================================================
# MESH QUALITY (Maximum Detail)
# =============================================================================
curvature_tol=1.0
apt_curv_tol=0.3
apt_curv_ext=0.5
coast_curv_tol=0.5
coast_curv_ext=0.5
limit_tris=4.0
mesh_zl=19
min_angle=10.0

# =============================================================================
# IMAGERY
# =============================================================================
default_zl=17
default_website=BI
cover_airports_with_highres=ICAO
cover_zl=19
cover_extent=1.0
sea_texture_blur=0.0

# =============================================================================
# WATER & MASKING
# =============================================================================
masking_mode=3steps
masks_width=100
mask_zl=15
ratio_water=0.25
ratio_bathy=1.0
distance_masks_too=True
masks_use_DEM_too=False
use_masks_for_inland=False
sea_smoothing_mode=zero
water_smoothing=10

# =============================================================================
# DSF QUALITY
# =============================================================================
terrain_casts_shadows=True
normal_map_strength=1.0
use_decal_on_terrain=True
overlay_lod=25000

# =============================================================================
# ROADS & VECTOR
# =============================================================================
road_level=1
road_banking_limit=0.5
lane_width=4.0
apt_smoothing_pix=8
clean_bad_geometries=True
water_simplification=0.0
min_area=0.001
max_area=200.0
max_levelled_segs=200000

# =============================================================================
# NETWORK & DOWNLOADS
# =============================================================================
max_download_slots=4
max_convert_slots=4
http_timeout=10.0
max_connect_retries=5
max_baddata_retries=5
check_tms_response=True
overpass_server_choice=random

# =============================================================================
# PERFORMANCE
# =============================================================================
verbosity=1
skip_downloads=False
skip_converts=False

# =============================================================================
# MESH REFINEMENT (for custom DEM/LIDAR)
# =============================================================================
# IMPORTANT: cleaning_level=0 is REQUIRED for iterate to work
cleaning_level=0
fill_nodata=False
iterate=0

# For .hgt files: place them in Elevation_data/<10-degree-block>/
# Example: Elevation_data/N40E000/N47E008.hgt
#
# For custom DEM with iterate, use semicolon-separated paths:
# custom_dem=/path/base.hgt;/path/lidar1.hgt;/path/lidar2.hgt
#            iterate=0       iterate=1        iterate=2
#custom_dem=

 # Step 1: Build initial mesh (iterate=0 in config)
 #python Ortho4XP.py 47 8 --mesh

 # Step 2: Edit config to set iterate=1
 # Then rebuild mesh - it will refine the previous mesh
 #python Ortho4XP.py 47 8 --mesh

 # Step 3: Build masks and DSF (uses final mesh)
 #python Ortho4XP.py 47 8 --mask
 #python Ortho4XP.py 47 8 --dsf

# =============================================================================
# X-PLANE 12 OVERLAYS
# =============================================================================
# Set these paths to your X-Plane 12 installation:
#
# macOS example:
#   custom_overlay_src=/Users/YOU/X-Plane 12/Global Scenery/X-Plane 12 Global Scenery
#   custom_scenery_dir=/Users/YOU/X-Plane 12/Custom Scenery
#
# Windows example:
#   custom_overlay_src=C:\X-Plane 12\Global Scenery\X-Plane 12 Global Scenery
#   custom_scenery_dir=C:\X-Plane 12\Custom Scenery

custom_overlay_src=
custom_scenery_dir=
ovl_exclude_pol=[0]
ovl_exclude_net=[]
